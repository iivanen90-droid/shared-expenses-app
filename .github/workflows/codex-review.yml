name: Request Codex review

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  pull-requests: write

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  request-review:
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post review request
        uses: actions/github-script@v8
        with:
          script: |
            const pullRequest = context.payload.pull_request;
            const marker = `<!-- codex-review:${pullRequest.head.sha} -->`;
            const issue = { ...context.repo, issue_number: pullRequest.number };
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { ...issue, per_page: 100 },
            );
            if (comments.some(comment =>
              comment.user.login === 'github-actions[bot]' &&
              comment.body?.includes(marker)
            )) {
              core.info('A review request already exists for this commit.');
              return;
            }
            await github.rest.issues.createComment({
              ...issue,
              body: `@codex review\n\n${marker}`,
            });
